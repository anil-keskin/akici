# Akıcı AI aracı sunucusu (Cloudflare Worker). Anahtar koda/git'e GİRMEZ: `npx wrangler secret put GEMINI_KEY`
name = "akici-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# IP başına dakikada en fazla 40 istek (evde 2 kişi + otomatik çeviri) (kötüye kullanıma karşı)
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

# Cihaz başına dakikada en fazla 25 istek
[[ratelimits]]
name = "PER_DEVICE"
namespace_id = "1002"
simple = { limit = 25, period = 60 }

[observability]
enabled = false

# Yedek: Cloudflare Workers AI (hesapta günlük ücretsiz kota, anahtar gerekmez)
[ai]
binding = "AI"

# Bulut yedeği: cihazda şifrelenmiş ilerleme kutuları (sunucu içini okuyamaz)
[[kv_namespaces]]
binding = "SYNC"
id = "50c13bfee8144d7aac1e2517f7659c89"
